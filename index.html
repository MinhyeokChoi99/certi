<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CBT Lab</title>
  <style>
    :root {
      --bg: #f2f1ed;
      --paper: #ffffff;
      --ink: #17202a;
      --muted: #707883;
      --line: #e2e4e8;
      --soft: #f7f8fa;
      --accent: #f1663d;
      --accent-deep: #c54827;
      --accent-soft: #fff0eb;
      --green: #237b55;
      --green-soft: #eaf7f0;
      --red: #c33f4f;
      --red-soft: #fff0f2;
      --shadow: 0 18px 60px rgba(30, 36, 43, 0.08);
      --radius-lg: 22px;
      --radius-md: 14px;
      --font-size-base: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: var(--font-size-base);
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible + .choice-label {
      outline: 3px solid rgba(241, 102, 61, 0.28);
      outline-offset: 3px;
    }

    .app-frame {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 22px 0 44px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 62px;
      margin-bottom: 22px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

    .workspace {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .rail, .question-card, .completion-card {
      border: 1px solid rgba(224, 226, 230, 0.86);
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .rail {
      position: sticky;
      top: 20px;
      padding: 22px;
      border-radius: var(--radius-lg);
    }
    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .rail h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.35;
      letter-spacing: -0.04em;
    }
    .rail-description {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .progress-ring {
      --progress: 20%;
      display: grid;
      place-items: center;
      width: 132px;
      height: 132px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--progress), #f0f1f3 0);
    }
    .progress-ring::before {
      content: "";
      position: absolute;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: var(--paper);
    }
    .progress-inner { position: relative; display: grid; gap: 0; text-align: center; }
    .progress-number { font-size: 26px; font-weight: 700; letter-spacing: -0.05em; }
    .progress-caption { color: var(--muted); font-size: 11px; }
    .rail-divider { height: 1px; margin: 20px 0; background: var(--line); }
    .rail-meta { display: grid; gap: 12px; margin: 0; }
    .rail-meta-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
    .rail-meta-row dt { color: var(--muted); }
    .rail-meta-row dd { margin: 0; font-weight: 600; text-align: right; }
    .rail-tip {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      padding: 12px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: #8a3b29;
      font-size: 12px;
    }
    .rail-tip-icon { flex: 0 0 auto; font-size: 15px; }

    .content { min-width: 0; }
    .filter-panel {
      display: grid;
      gap: 14px;
      margin-bottom: 14px;
      padding: 16px 18px;
      border: 1px solid rgba(224, 226, 230, 0.86);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 30px rgba(30, 36, 43, 0.04);
    }
    .filter-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .filter-title { margin: 0; color: var(--ink); font-size: 13px; font-weight: 700; }
    .filter-count { color: var(--muted); font-size: 12px; }
    .filter-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .filter-field { display: grid; gap: 6px; }
    .filter-field span { color: var(--muted); font-size: 11px; font-weight: 700; }
    .filter-field select {
      width: 100%;
      min-height: 39px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--soft);
      cursor: pointer;
    }
    .filter-field select:focus-visible { outline: 3px solid rgba(241, 102, 61, 0.2); outline-offset: 2px; }
    .session-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 4px 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .session-name { color: var(--ink); font-weight: 600; }
    .session-count { white-space: nowrap; }
    .question-card, .completion-card { border-radius: var(--radius-lg); }
    .question-card { padding: clamp(24px, 4vw, 46px); }
    .question-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }
    .question-number { margin: 0 0 7px; color: var(--accent); font-size: 13px; font-weight: 700; }
    .question-title { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.3; letter-spacing: -0.05em; }
    .subject-tag {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #ffd3c7;
      border-radius: 999px;
      color: var(--accent-deep);
      background: var(--accent-soft);
      font-size: 11px;
      font-weight: 700;
    }
    .question-copy {
      max-width: 830px;
      margin: 0 0 25px;
      font-size: 17px;
      line-height: 1.75;
      letter-spacing: -0.02em;
    }
    .question-copy strong { font-weight: 700; }
    .question-copy code {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 6px;
      color: #334155;
      background: #f0f2f5;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
    }
    .choices { display: grid; gap: 11px; margin: 0; padding: 0; border: 0; }
    .choices legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    .choice { position: relative; }
    .choice-input { position: absolute; opacity: 0; }
    .choice-label {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .choice-label:hover { border-color: #f5aa96; background: #fffaf8; transform: translateY(-1px); }
    .choice-input:checked + .choice-label { border-color: var(--accent); background: var(--accent-soft); }
    .choice-letter {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border: 1px solid #dfe2e7;
      border-radius: 50%;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .choice-input:checked + .choice-label .choice-letter { border-color: var(--accent); color: var(--accent-deep); background: #fff; }
    .choice-text { font-size: 15px; }
    .choice-label.is-correct { border-color: #9ad5b8; background: var(--green-soft); }
    .choice-label.is-correct .choice-letter { border-color: var(--green); color: var(--green); background: #fff; }
    .choice-label.is-wrong { border-color: #e9a6ae; background: var(--red-soft); }
    .choice-label.is-wrong .choice-letter { border-color: var(--red); color: var(--red); background: #fff; }
    .choice-result { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 700; }
    .question-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }
    .primary-button, .secondary-button {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
    }
    .primary-button { border: 1px solid var(--accent); color: #fff; background: var(--accent); box-shadow: 0 8px 18px rgba(241, 102, 61, 0.18); }
    .primary-button:hover:not(:disabled) { background: var(--accent-deep); transform: translateY(-1px); }
    .secondary-button { border: 1px solid var(--line); color: var(--ink); background: #fff; }
    .secondary-button:hover { background: var(--soft); }
    .primary-button:disabled { cursor: not-allowed; opacity: 0.5; box-shadow: none; }

    .feedback {
      display: grid;
      gap: 15px;
      margin-top: 22px;
      padding: 19px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
    .feedback.correct { border-color: #bce4cb; background: var(--green-soft); }
    .feedback.incorrect { border-color: #f0c0c6; background: var(--red-soft); }
    .feedback-head { display: flex; align-items: center; gap: 10px; }
    .feedback-icon { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; color: #fff; font-size: 14px; font-weight: 700; }
    .correct .feedback-icon { background: var(--green); }
    .incorrect .feedback-icon { background: var(--red); }
    .feedback-title { font-size: 16px; font-weight: 700; }
    .feedback-answer { margin: 0; color: var(--ink); font-size: 14px; }
    .feedback-answer strong { font-weight: 700; }
    .explanation {
      display: grid;
      gap: 19px;
      padding-top: 16px;
      border-top: 1px solid rgba(45, 61, 70, 0.12);
      color: #35404a;
      font-size: 14px;
      line-height: 1.7;
    }
    .explanation-label { display: block; margin-bottom: 4px; color: var(--ink); font-size: 12px; font-weight: 700; }
    .explanation-grid { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 22px; align-items: start; }
    .explanation-summary { margin: 0 0 13px; color: var(--ink); }
    .solution-steps { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .solution-step { display: grid; grid-template-columns: 23px minmax(0, 1fr); gap: 9px; align-items: start; }
    .step-index { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; color: var(--accent-deep); background: var(--accent-soft); font-size: 11px; font-weight: 700; }
    .solution-step code, .choice-note code { padding: 1px 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.7); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    .concept-card { display: grid; gap: 8px; padding: 14px; border: 1px solid #ffd3c7; border-radius: 12px; background: rgba(255, 255, 255, 0.62); }
    .concept-label { color: var(--accent-deep); font-size: 11px; font-weight: 700; }
    .concept-card strong { color: var(--ink); font-size: 14px; line-height: 1.55; }
    .choice-review { display: grid; gap: 8px; padding-top: 15px; border-top: 1px solid rgba(45, 61, 70, 0.12); }
    .choice-note { display: grid; grid-template-columns: minmax(118px, 0.28fr) minmax(0, 1fr); gap: 12px; padding: 8px 10px; border-radius: 9px; background: rgba(255, 255, 255, 0.48); font-size: 13px; }
    .choice-note-answer { color: var(--green); background: rgba(255, 255, 255, 0.78); }
    .choice-note-label { color: var(--ink); font-weight: 700; }
    .choice-note-answer .choice-note-label::after { content: "  · 정답"; color: var(--green); font-size: 11px; }
    .completion-card { padding: clamp(28px, 5vw, 60px); text-align: center; }
    .completion-icon { display: grid; place-items: center; width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 20px; color: #fff; background: var(--accent); font-size: 28px; }
    .completion-card h2 { margin: 0; font-size: 28px; letter-spacing: -0.05em; }
    .completion-card p { margin: 10px auto 24px; color: var(--muted); }
    .score { display: inline-flex; align-items: baseline; gap: 5px; margin-bottom: 25px; color: var(--accent-deep); }
    .score strong { font-size: 48px; line-height: 1; letter-spacing: -0.07em; }
    .score span { color: var(--muted); font-size: 15px; }

    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; }
      .rail { position: static; display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: center; padding: 18px 20px; }
      .rail-description { grid-column: 1; margin: 6px 0 0; }
      .progress-ring { grid-column: 2; grid-row: 1 / span 2; width: 88px; height: 88px; margin: 0; }
      .progress-ring::before { width: 68px; height: 68px; }
      .progress-number { font-size: 20px; }
      .rail-divider, .rail-meta, .rail-tip { display: none; }
    }
    @media (max-width: 540px) {
      .app-frame { width: min(100% - 24px, 1180px); padding-top: 12px; }
      .topbar { align-items: flex-start; margin-bottom: 14px; }
      .topbar-actions { display: none; }
      .question-card { padding: 22px 18px; }
      .question-heading { display: block; margin-bottom: 22px; }
      .subject-tag { display: inline-flex; margin-top: 12px; }
      .question-copy { font-size: 16px; }
      .choice-label { min-height: 54px; padding: 10px 12px; }
      .choice-text { font-size: 14px; }
      .question-actions { display: grid; grid-template-columns: 1fr; }
      .primary-button, .secondary-button { width: 100%; }
      .session-bar { margin: 0 2px 10px; }
      .filter-panel { padding: 14px; }
      .filter-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <div class="topbar-actions">
        <span class="status-pill"><span class="status-dot"></span>문제은행</span>
        <span>2022~2026년 문제은행</span>
      </div>
    </header>

    <main class="workspace">
      <aside class="rail" aria-label="학습 진행 정보">
        <div>
          <p class="eyebrow">Study set</p>
          <h1>2022~2026년<br />필기 문제은행</h1>
          <p class="rail-description">현행 출제 형식의 문제를 하나씩 풀고, 제출 후 바로 풀이를 확인하세요.</p>
        </div>
        <div class="progress-ring" id="progressRing" aria-label="진행률">
          <div class="progress-inner">
            <span class="progress-number" id="progressNumber">1/780</span>
            <span class="progress-caption">현재 진행</span>
          </div>
        </div>
        <div class="rail-divider"></div>
        <dl class="rail-meta">
          <div class="rail-meta-row"><dt>출처</dt><dd id="sourceMeta">2022~2026년</dd></div>
          <div class="rail-meta-row"><dt>문제 수</dt><dd id="questionCountMeta">780문제</dd></div>
          <div class="rail-meta-row"><dt>풀이</dt><dd>제출 후 제공</dd></div>
        </dl>
        <div class="rail-tip"><span class="rail-tip-icon">✦</span><span>정답을 고른 뒤 제출하면 핵심 개념과 풀이가 열립니다.</span></div>
      </aside>

      <section class="content" aria-live="polite">
        <section class="filter-panel" aria-label="문제 범위 선택">
          <div class="filter-heading">
            <p class="filter-title">문제 범위</p>
            <span class="filter-count" id="filterCount">780문제</span>
          </div>
          <div class="filter-fields">
            <label class="filter-field">
              <span>연도</span>
              <select id="yearFilter" aria-label="연도 선택"></select>
            </label>
            <label class="filter-field">
              <span>회차</span>
              <select id="sessionFilter" aria-label="회차 선택"></select>
            </label>
            <label class="filter-field">
              <span>과목</span>
              <select id="subjectFilter" aria-label="과목 선택"></select>
            </label>
          </div>
        </section>
        <div class="session-bar">
          <span class="session-name" id="sessionName">필기 문제은행 · 정보시스템 기반 기술</span>
          <span class="session-count" id="sessionCount">1 / 780</span>
        </div>
        <div id="app"></div>
      </section>
    </main>
  </div>

  <script src="./data/question-bank.js"></script>

            "하향식 통합은 상위 모듈부터 결합하므로, 아직 구현되지 않은 하위 모듈을 대신하는 스텁을 사용합니다.",
            "통합 테스트는 모듈 간 인터페이스와 상호 작용 오류를 찾습니다. 개별 모듈의 기능성 검증을 최우선으로 한다는 ④는 단위 테스트에 가까운 설명이므로 틀렸습니다."

          choiceNotes: [

      },
      {

        subject: "정보시스템 기반 기술",
        prompt: "정보 전송 중 발생하는 오류를 검색하고 정정하기에 용이하도록 만든 코드는?",
        choices: ["Excess-3 code", "Hamming code", "Gray code", "Biquinary Code"],

          ],
          memory: "Hamming = 패리티 비트 + 신드롬 + 단일 비트 오류 정정"
        }
      },
      {
        number: 5,
        subject: "정보시스템 기반 기술",
        prompt: "사용자 인터페이스 설계를 위한 인간공학적 원리에 포함되지 않는 것은?",
        choices: ["지름길을 제공한다.", "작업의 진행 상황을 알려준다.", "일관된 인터페이스를 가진다.", "사용자의 비전문성을 인정하지 않는다."],
        answer: 3,
        explanation: {
          summary: "인간공학적 UI 원리는 사용자의 기억 부담과 실수를 줄이고, 숙련도와 관계없이 작업을 완수할 수 있도록 돕는 데 초점을 둡니다.",
          steps: [
            "반복 작업을 줄이는 지름길은 숙련 사용자의 효율을 높입니다.",
            "작업 진행 상황을 알려주면 사용자는 시스템이 멈췄는지, 얼마나 남았는지 판단할 수 있습니다.",
            "화면과 조작의 일관성은 학습 비용을 낮춥니다. 반대로 비전문 사용자를 고려하지 않는 것은 사용자 중심 설계에 어긋나므로 정답은 ④입니다."
          ],
          choiceNotes: [
            "효율성을 높이는 대표적인 사용자 인터페이스 원리입니다.",
            "시스템 상태를 가시적으로 알려주는 원리입니다.",
            "사용자의 예측 가능성과 학습성을 높입니다.",
            "비전문 사용자도 사용할 수 있게 해야 하므로 인간공학 원리에 포함되지 않습니다."
          ],
          memory: "좋은 UI = 효율성 + 상태 가시성 + 일관성 + 사용자 수준 고려"
        }
      }
    ];
    */

    const letters = ["①", "②", "③", "④"];
    const ALL = "all";
    const subjectOrder = ["정보시스템 기반 기술", "프로그래밍언어 활용", "데이터베이스 활용"];
    const yearFilter = document.getElementById("yearFilter");
    const sessionFilter = document.getElementById("sessionFilter");
    const subjectFilter = document.getElementById("subjectFilter");
    const filterCount = document.getElementById("filterCount");
    const app = document.getElementById("app");
    const progressNumber = document.getElementById("progressNumber");
    const progressRing = document.getElementById("progressRing");
    const sessionCount = document.getElementById("sessionCount");
    const sessionName = document.getElementById("sessionName");
    const sourceMeta = document.getElementById("sourceMeta");
    const questionCountMeta = document.getElementById("questionCountMeta");
    let questions = shuffleQuestions(questionBank);
    let activeYear = ALL;
    let activeSession = ALL;
    let activeSubject = ALL;
    let current = 0;
    let selected = null;
    let submitted = false;
    let results = [];

    function shuffleQuestions(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }
      return shuffled;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setOptions(select, options, selectedValue) {
      select.innerHTML = options.map(({ value, label }) => `<option value="${value}">${label}</option>`).join("");
      select.value = selectedValue;
    }

    function availableSessions() {
      const source = activeYear === ALL
        ? questionBank
        : questionBank.filter((question) => String(question.year) === activeYear);
      return [...new Set(source.map((question) => question.session))].sort((a, b) => a - b);
    }

    function refreshFilterOptions() {
      const sessions = availableSessions();
      if (activeSession !== ALL && !sessions.includes(Number(activeSession))) activeSession = ALL;
      const subjects = subjectOrder.filter((subject) => questionBank.some((question) => {
        const sameYear = activeYear === ALL || String(question.year) === activeYear;
        const sameSession = activeSession === ALL || String(question.session) === activeSession;
        return sameYear && sameSession && question.subject === subject;
      }));
      if (activeSubject !== ALL && !subjects.includes(activeSubject)) activeSubject = ALL;

      setOptions(yearFilter, [
        { value: ALL, label: "전체 연도" },
        ...[...new Set(questionBank.map((question) => question.year))].sort((a, b) => a - b)
          .map((year) => ({ value: String(year), label: `${year}년` })),
      ], activeYear);
      setOptions(sessionFilter, [
        { value: ALL, label: "전체 회차" },
        ...sessions.map((session) => ({ value: String(session), label: `${session}회` })),
      ], activeSession);
      setOptions(subjectFilter, [
        { value: ALL, label: "전체 과목" },
        ...subjects.map((subject) => ({ value: subject, label: subject })),
      ], activeSubject);
    }

    function applyFilters() {
      return questionBank.filter((question) => {
        const sameYear = activeYear === ALL || String(question.year) === activeYear;
        const sameSession = activeSession === ALL || String(question.session) === activeSession;
        const sameSubject = activeSubject === ALL || question.subject === activeSubject;
        return sameYear && sameSession && sameSubject;
      });
    }

    function filterSummary() {
      const yearLabel = activeYear === ALL ? "전체 연도" : `${activeYear}년`;
      const sessionLabel = activeSession === ALL ? "전체 회차" : `${activeSession}회`;
      const subjectLabel = activeSubject === ALL ? "전체 과목" : activeSubject;
      return `${yearLabel} · ${sessionLabel} · ${subjectLabel}`;
    }

    function resetProgress() {
      questions = shuffleQuestions(questions);
      current = 0;
      selected = null;
      submitted = false;
      results = [];
      questionCountMeta.textContent = `${questions.length}문제`;
      filterCount.textContent = `${questions.length}문제`;
      render();
    }

    function changeFilter() {
      activeYear = yearFilter.value;
      activeSession = sessionFilter.value;
      activeSubject = subjectFilter.value;
      refreshFilterOptions();
      questions = applyFilters();
      resetProgress();
    }

    yearFilter.addEventListener("change", changeFilter);
    sessionFilter.addEventListener("change", changeFilter);
    subjectFilter.addEventListener("change", changeFilter);
    refreshFilterOptions();
    questionCountMeta.textContent = `${questions.length}문제`;
    filterCount.textContent = `${questions.length}문제`;

    function render() {
      const progress = ((current + (submitted ? 1 : 0)) / questions.length) * 100;
      progressNumber.textContent = `${current + 1}/${questions.length}`;
      progressRing.style.setProperty("--progress", `${Math.max(20, progress)}%`);
      sessionCount.textContent = `${current + 1} / ${questions.length}`;

      if (current >= questions.length) {
        renderCompletion();
        return;
      }

      const question = questions[current];
      const sourceLabel = `${question.year}년 ${question.session}회`;
      sessionName.innerHTML = `${sourceLabel} <span aria-hidden="true">·</span> ${escapeHtml(question.subject)}`;
      sourceMeta.textContent = sourceLabel;

      const choiceMarkup = question.choices.map((choice, index) => {
        let stateClass = "";
        let resultText = "";
        if (submitted && index === question.answer) {
          stateClass = "is-correct";
          resultText = "정답";
        } else if (submitted && index === selected && index !== question.answer) {
          stateClass = "is-wrong";
          resultText = "선택함";
        }
        return `
          <div class="choice">
            <input class="choice-input" type="radio" name="question-${question.id}" id="choice-${question.id}-${index}" value="${index}" ${selected === index ? "checked" : ""} ${submitted ? "disabled" : ""} />
            <label class="choice-label ${stateClass}" for="choice-${question.id}-${index}">
              <span class="choice-letter">${letters[index]}</span>
              <span class="choice-text">${escapeHtml(choice)}</span>
              ${resultText ? `<span class="choice-result">${resultText}</span>` : ""}
            </label>
          </div>`;
      }).join("");

      const isCorrect = submitted && selected === question.answer;
      const stepMarkup = question.explanation.steps.map((step, index) => `
        <li class="solution-step"><span class="step-index">${index + 1}</span><span>${escapeHtml(step)}</span></li>`).join("");
      const choiceReviewMarkup = question.explanation.choiceNotes.map((note, index) => `
        <div class="choice-note ${index === question.answer ? "choice-note-answer" : ""}">
          <span class="choice-note-label">${letters[index]} ${escapeHtml(question.choices[index])}</span>
          <span>${escapeHtml(note)}</span>
        </div>`).join("");
      const explanationTitle = question.explanation.kind === "detailed" ? "핵심 풀이" : "풀이 가이드";
      const feedbackMarkup = submitted ? `
        <section class="feedback ${isCorrect ? "correct" : "incorrect"}" aria-label="채점 결과">
          <div class="feedback-head">
            <span class="feedback-icon">${isCorrect ? "✓" : "!"}</span>
            <span class="feedback-title">${isCorrect ? "정답입니다" : "아쉽지만 오답입니다"}</span>
          </div>
          <p class="feedback-answer">정답은 <strong>${letters[question.answer]} ${escapeHtml(question.choices[question.answer])}</strong>입니다.</p>
          <div class="explanation">
            <div class="explanation-grid">
              <div>
                <span class="explanation-label">${explanationTitle}</span>
                <p class="explanation-summary">${escapeHtml(question.explanation.summary)}</p>
                <ol class="solution-steps">${stepMarkup}</ol>
              </div>
              <aside class="concept-card">
                <span class="concept-label">기억할 개념</span>
                <strong>${escapeHtml(question.explanation.memory)}</strong>
              </aside>
            </div>
            <div class="choice-review">
              <span class="explanation-label">선택지별 판별</span>
              ${choiceReviewMarkup}
            </div>
          </div>
        </section>` : "";

      app.innerHTML = `
        <article class="question-card">
          <div class="question-heading">
            <div>
              <p class="question-number">QUESTION ${String(question.number).padStart(2, "0")} <span aria-hidden="true">·</span> ${sourceLabel}</p>
              <h2 class="question-title">문제를 읽고 가장 알맞은 답을 고르세요.</h2>
            </div>
            <span class="subject-tag">${escapeHtml(question.subject)}</span>
          </div>
          <p class="question-copy">${escapeHtml(question.prompt)}</p>
          <fieldset class="choices">
            <legend>답안 선택</legend>
            ${choiceMarkup}
          </fieldset>
          ${feedbackMarkup}
          <div class="question-actions">
            ${submitted ? `<button class="secondary-button" type="button" id="nextButton">${current === questions.length - 1 ? "결과 보기" : "다음 문제"} →</button>` : `<button class="primary-button" type="button" id="submitButton" ${selected === null ? "disabled" : ""}>정답 제출</button>`}
          </div>
        </article>`;

      if (!submitted) {
        document.querySelectorAll(".choice-input").forEach((input) => {
          input.addEventListener("change", (event) => {
            selected = Number(event.target.value);
            render();
          });
        });
        document.getElementById("submitButton").addEventListener("click", submitAnswer);
      } else {
        document.getElementById("nextButton").addEventListener("click", nextQuestion);
      }
    }

    function submitAnswer() {
      const question = questions[current];
      results[current] = selected === question.answer;
      submitted = true;
      render();
    }

    function nextQuestion() {
      current += 1;
      selected = null;
      submitted = false;
      render();
    }

    function renderCompletion() {
      const correct = results.filter(Boolean).length;
      progressNumber.textContent = `${questions.length}/${questions.length}`;
      progressRing.style.setProperty("--progress", "100%");
      sessionCount.textContent = "완료";
      sessionName.textContent = "선택한 문제 범위 풀이 완료";
      sourceMeta.textContent = filterSummary();
      app.innerHTML = `
        <section class="completion-card">
          <div class="completion-icon">✓</div>
          <p class="eyebrow">Set complete</p>
          <h2>문제은행을 모두 풀었습니다.</h2>
          <p>제출한 답안을 기준으로 채점한 결과입니다.</p>
          <div class="score"><strong>${correct}</strong><span>/ ${questions.length} 정답</span></div>
          <br />
          <button class="primary-button" type="button" id="restartButton">다시 풀기</button>
        </section>`;
      document.getElementById("restartButton").addEventListener("click", () => {
        current = 0;
        selected = null;
        submitted = false;
        results = [];
        render();
      });
    }

    render();
  </script>
